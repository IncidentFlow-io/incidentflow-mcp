          type: string
          description: Slack root message timestamp or thread_ts.
        include_root:
          type: boolean
          default: true
          description: Include parsed root alert details in the response.
        include_raw:
          type: boolean
          default: false
          description: 'Include unfiltered raw Slack message text in the root alert. Default false returns
