    knowledge_upsertArguments:
      type: object
      properties:
        document_type:
          type: string
          enum:
          - knowledge
          - incident
          - rca
          - postmortem
          - runbook
          description: Kind of private knowledge document to save.
        title:
          type: string
        text:
          type: string
          description: Markdown or plain text body to store.
        id:
          type: string
          description: Stable document id. Required for incidents; generated from title for other document
            types when omitted.
        service:
          type: string
          description: Optional service name.
        cluster:
          type: string
          description: Optional cluster name.
        namespace:
          type: string
          description: Optional namespace.
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          - info
        status:
          type: string
          description: Optional status, e.g. active, draft, open, or resolved.
        started_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
          description: Keyword tags for filtering, e.g. ['kubernetes', 'startupProbe'].
        dry_run:
          type: boolean
          default: false
          description: If true, validate and return what would be stored without writing.
      required:
      - document_type
      - title
      - text
      title: knowledge_upsertArguments
