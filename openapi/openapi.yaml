    JsonRpcInitializeRequest:
      type: object
      required:
      - jsonrpc
      - id
      - method
      - params
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - initialize
        params:
          $ref: '#/components/schemas/InitializeParams'
    JsonRpcToolsListRequest:
      type: object
      required:
      - jsonrpc
      - id
      - method
      - params
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - tools/list
        params:
          $ref: '#/components/schemas/ToolsListParams'
    JsonRpcToolsCallRequest:
      type: object
      required:
      - jsonrpc
      - id
      - method
      - params
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - tools/call
        params:
          $ref: '#/components/schemas/ToolsCallParams'
    JsonRpcRequest:
      oneOf:
      - $ref: '#/components/schemas/JsonRpcInitializeRequest'
      - $ref: '#/components/schemas/JsonRpcToolsListRequest'
      - $ref: '#/components/schemas/JsonRpcToolsCallRequest'
    JsonRpcSuccessResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
          - type: 'null'
        result:
          type: object
          additionalProperties: true
    JsonRpcError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    JsonRpcErrorResponse:
      type: object
      required:
      - jsonrpc
      - id
      - error
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
          - type: 'null'
        error:
          $ref: '#/components/schemas/JsonRpcError'
    UnauthorizedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: 'Missing or malformed Authorization: Bearer <token>.'
    ForbiddenScopeError:
      type: object
      required:
      - error
      - required_scope
      properties:
        error:
          type: string
          enum:
          - insufficient_scope
        required_scope:
          type: string
          example: mcp:tools:run
    ForbiddenDetailError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Insufficient token scope
    RateLimitError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Too Many Requests
    InternalServerError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: internal server error
  responses:
    UnauthorizedError:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ForbiddenScopeError'
            - $ref: '#/components/schemas/ForbiddenDetailError'
    RateLimitError:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
    InternalServerError:
      description: Unhandled exception
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token auth. In development with no auth provider configured, /mcp may run unprotected.
tags:
- name: ops
  description: Operational/public endpoints
- name: mcp
  description: MCP Streamable HTTP transport endpoint
