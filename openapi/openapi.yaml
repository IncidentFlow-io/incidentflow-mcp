openapi: 3.1.0
info:
  title: IncidentFlow MCP API
  description: Canonical API specification for IncidentFlow MCP. Generated from FastAPI routes and MCP
    tool metadata.
  version: 0.1.0
paths:
  /install.sh:
    get:
      tags:
      - ops
      summary: Installer script
      description: Return a curl-able installer script with a URL derived from current host.
      operationId: install_sh_install_sh_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /healthz:
    get:
      tags:
      - ops
      summary: Liveness probe
      description: "Returns 200 OK. Used by Docker/Kubernetes liveness probes \u2014 no auth required."
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /readyz:
    get:
      tags:
      - ops
      summary: Readiness probe
      description: "Returns 200 when the app is ready to serve traffic \u2014 no auth required."
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /metrics:
    get:
      tags:
      - ops
      summary: Prometheus metrics
      description: Prometheus metrics endpoint.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /version:
    get:
      tags:
      - ops
      summary: Service + contract version
      description: "Unauthenticated version/contract block \u2014 no secrets. Mirrors mcp_version."
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /schemas:
    get:
      tags:
      - ops
      summary: JSON Schema catalog
      description: Catalog of published JSON Schemas (envelope, error, per-tool responses).
      operationId: schemas_schemas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /schemas/{schema_id}:
    get:
      tags:
      - ops
      summary: One JSON Schema by id
      description: Return one generated Draft 2020-12 JSON Schema, or 404 if unknown.
      operationId: schema_by_id_schemas__schema_id__get
      parameters:
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          title: Schema Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /.well-known/oauth-protected-resource:
    get:
      tags:
      - ops
      summary: OAuth protected resource metadata
      operationId: oauth_protected_resource__well_known_oauth_protected_resource_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
      - ops
      summary: OAuth protected resource metadata (MCP path)
      operationId: oauth_protected_resource_mcp__well_known_oauth_protected_resource_mcp_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - ops
      summary: OAuth authorization server metadata
      operationId: oauth_authorization_server_metadata__well_known_oauth_authorization_server_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /.well-known/openid-configuration:
    get:
      tags:
      - ops
      summary: OpenID Connect discovery metadata
      operationId: openid_configuration__well_known_openid_configuration_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /.well-known/jwks.json:
    get:
      tags:
      - ops
      summary: OAuth JWKS redirect
      operationId: oauth_jwks__well_known_jwks_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /oauth/register:
    post:
      tags:
      - ops
      summary: OAuth dynamic client registration bridge
      operationId: oauth_register_oauth_register_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /register:
    post:
      tags:
      - ops
      summary: OAuth dynamic client registration bridge
      operationId: oauth_register_register_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /authorize:
    get:
      tags:
      - ops
      summary: OAuth authorization redirect
      operationId: oauth_authorize_authorize_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /token:
    post:
      tags:
      - ops
      summary: OAuth token endpoint bridge
      operationId: oauth_token_token_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /revoke:
    post:
      tags:
      - ops
      summary: OAuth token revocation bridge
      operationId: oauth_revoke_revoke_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /.well-known/{challenge_path}:
    get:
      tags:
      - ops
      summary: OpenAI domain verification
      description: Return the configured OpenAI Apps domain-verification token.
      operationId: openai_domain_verification__well_known__challenge_path__get
      parameters:
      - name: challenge_path
        in: path
        required: true
        schema:
          type: string
          title: Challenge Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /mcp:
    get:
      tags:
      - mcp
      operationId: mcpGet
      summary: MCP Streamable HTTP handshake
      description: MCP Streamable HTTP endpoint (custom ASGI proxy route). GET is supported by transport
        and may be used by MCP clients for handshake/session semantics.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: MCP GET response from FastMCP transport
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
              example: 'event: message\ndata: {...}\n\n'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
      - mcp
      operationId: mcpOptions
      summary: MCP CORS preflight
      description: OPTIONS support for MCP endpoint (kept for CORS preflight compatibility).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: CORS preflight response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - mcp
      operationId: mcpPost
      summary: MCP JSON-RPC endpoint
      description: Primary MCP endpoint. Accepts JSON-RPC requests such as `initialize`, `tools/list`,
        and `tools/call`. Some responses may stream over SSE depending on client transport/session flow.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                summary: Initialize session
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2024-11-05'
                    capabilities: {}
                    clientInfo:
                      name: local-dev
                      version: 0.1.0
              toolsList:
                summary: List available tools
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
                  params: {}
              incidentSummaryCall:
                summary: Call incident_summary
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: incident_summary
                    arguments:
                      incident_id: INC-001
                      include_timeline: true
                      include_affected_services: true
                      execution_mode: auto
              correlateAlertsCall:
                summary: Call correlate_alerts
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: tools/call
                  params:
                    name: correlate_alerts
                    arguments:
                      alerts_json: '[{"alert_id":"a1","name":"HighMemoryUsage","service":"api-gateway","severity":"critical","status":"firing","fired_at":"2024-01-15T10:00:00Z","labels":{"env":"prod"}}]'
                      window_minutes: 30
                      min_cluster_size: 2
                      execution_mode: auto
              externalStatusCall:
                summary: Call external_status_check
                value:
                  jsonrpc: '2.0'
                  id: 5
                  method: tools/call
                  params:
                    name: external_status_check
                    arguments:
                      providers:
                      - github
                      days_back: 30
                      wait_for_result: true
                      execution_mode: async
                      response_mode: compact
      responses:
        '200':
          description: JSON-RPC success or error payload
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JsonRpcSuccessResponse'
                - $ref: '#/components/schemas/JsonRpcErrorResponse'
              examples:
                success:
                  summary: Generic success response
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    result:
                      tools: []
                rateLimitToolError:
                  summary: Tool-level guard error (still HTTP 200)
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    error:
                      code: -32029
                      message: Rate limit exceeded for tool invocation
            text/event-stream:
              schema:
                type: string
              example: 'event: message\ndata: {...}\n\n'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    IncidentSummaryInput:
      description: Input for the incident_summary tool.
      properties:
        incident_id:
          description: Unique incident identifier
          maxLength: 128
          minLength: 1
          title: Incident Id
          type: string
        include_timeline:
          default: true
          description: Include event timeline in summary
          title: Include Timeline
          type: boolean
        include_affected_services:
          default: true
          description: Include impacted service list
          title: Include Affected Services
          type: boolean
      required:
      - incident_id
      title: IncidentSummaryInput
      type: object
    Severity:
      enum:
      - critical
      - high
      - medium
      - warning
      - low
      - info
      title: Severity
      type: string
    TimelineEvent:
      properties:
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        description:
          title: Description
          type: string
        actor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Actor
      required:
      - timestamp
      - description
      title: TimelineEvent
      type: object
    IncidentSummaryOutput:
      description: Output from the incident_summary tool.
      properties:
        incident_id:
          title: Incident Id
          type: string
        title:
          title: Title
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          title: Status
          type: string
        summary:
          title: Summary
          type: string
        affected_services:
          items:
            type: string
          title: Affected Services
          type: array
        timeline:
          items:
            $ref: '#/components/schemas/TimelineEvent'
          title: Timeline
          type: array
        recommendations:
          items:
            type: string
          title: Recommendations
          type: array
        human_context_from_slack_thread:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Human Context From Slack Thread
      required:
      - incident_id
      - title
      - severity
      - status
      - summary
      - affected_services
      - timeline
      - recommendations
      title: IncidentSummaryOutput
      type: object
    Alert:
      description: A single alert to be correlated.
      properties:
        alert_id:
          maxLength: 128
          minLength: 1
          title: Alert Id
          type: string
        name:
          title: Name
          type: string
        service:
          title: Service
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        fired_at:
          format: date-time
          title: Fired At
          type: string
        labels:
          additionalProperties:
            type: string
          title: Labels
          type: object
        slack:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Slack
        thread:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Thread
      required:
      - alert_id
      - name
      - service
      - severity
      - status
      - fired_at
      title: Alert
      type: object
    AlertStatus:
      enum:
      - firing
      - resolved
      - pending
      title: AlertStatus
      type: string
    CorrelateAlertsInput:
      description: Input for the correlate_alerts tool.
      properties:
        alerts:
          description: List of alerts to correlate
          items:
            $ref: '#/components/schemas/Alert'
          maxItems: 500
          minItems: 1
          title: Alerts
          type: array
        window_minutes:
          default: 60
          description: Correlation time window in minutes
          maximum: 1440
          minimum: 1
          title: Window Minutes
          type: integer
        min_cluster_size:
          default: 2
          description: Minimum alerts in a cluster to report
          minimum: 1
          title: Min Cluster Size
          type: integer
      required:
      - alerts
      title: CorrelateAlertsInput
      type: object
    AlertCluster:
      description: A group of correlated alerts.
      properties:
        cluster_id:
          title: Cluster Id
          type: string
        alert_ids:
          items:
            type: string
          title: Alert Ids
          type: array
        services:
          items:
            type: string
          title: Services
          type: array
        dominant_severity:
          $ref: '#/components/schemas/Severity'
        likely_root_cause:
          title: Likely Root Cause
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        evidence:
          items:
            type: string
          title: Evidence
          type: array
        confidence_level:
          default: possible
          title: Confidence Level
          type: string
        missing_evidence:
          items:
            type: string
          title: Missing Evidence
          type: array
        human_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Human Context
      required:
      - cluster_id
      - alert_ids
      - services
      - dominant_severity
      - likely_root_cause
      - confidence
      title: AlertCluster
      type: object
    CorrelateAlertsOutput:
      description: Output from the correlate_alerts tool.
      properties:
        total_alerts:
          title: Total Alerts
          type: integer
        clusters:
          items:
            $ref: '#/components/schemas/AlertCluster'
          title: Clusters
          type: array
        uncorrelated_alert_ids:
          items:
            type: string
          title: Uncorrelated Alert Ids
          type: array
        analysis_window_minutes:
          title: Analysis Window Minutes
          type: integer
        summary:
          title: Summary
          type: string
      required:
      - total_alerts
      - clusters
      - uncorrelated_alert_ids
      - analysis_window_minutes
      - summary
      title: CorrelateAlertsOutput
      type: object
    incidentflow_capabilitiesArguments:
      type: object
      properties:
        response_mode:
          type: string
          enum:
          - compact
          - full
          default: compact
          description: compact omits long descriptions; full includes full metadata.
        category:
          type: string
          description: Optional category id filter, e.g. kubernetes, grafana_prometheus, slack_incidents,
            or knowledge.
      required: []
      title: incidentflow_capabilitiesArguments
    mcp_versionArguments:
      type: object
      properties: {}
      required: []
      title: mcp_versionArguments
    incidentflow_auth_statusArguments:
      type: object
      properties: {}
      additionalProperties: false
      title: incidentflow_auth_statusArguments
    incidentflow_integrations_statusArguments:
      type: object
      properties: {}
      additionalProperties: false
      title: incidentflow_integrations_statusArguments
    public_knowledge_searchArguments:
      type: object
      properties:
        query:
          type: string
          description: Natural language public knowledge query.
        document_type:
          type: string
          enum:
          - documentation
          - integration_guide
          - tool_reference
          - runbook
          - troubleshooting
          - best_practice
          - security_documentation
          - faq
          - api_reference
          description: Optional public document type filter.
        response_mode:
          type: string
          enum:
          - compact
          - full
          default: compact
          description: compact returns excerpts only; full includes complete content.
        limit:
          type: integer
          default: 8
          minimum: 1
          maximum: 20
      required:
      - query
      title: public_knowledge_searchArguments
    private_knowledge_searchArguments:
      type: object
      properties:
        query:
          type: string
          description: Natural language private query.
        document_type:
          type: string
          enum:
          - incident
          - rca
          - postmortem
          - runbook
          - knowledge
          - service_context
          - deployment_note
          description: Optional workspace document type filter.
        service:
          type: string
          description: Optional service filter.
        environment:
          type: string
          description: Optional workspace environment filter.
        response_mode:
          type: string
          enum:
          - compact
          - full
          default: compact
          description: compact returns excerpts only; full includes complete content.
        limit:
          type: integer
          default: 8
          minimum: 1
          maximum: 20
      required:
      - query
      title: private_knowledge_searchArguments
    knowledge_getArguments:
      type: object
      properties:
        id:
          type: string
          description: UI UUID, entry id, point id, exact title, or stable document id.
        id_type:
          type: string
          enum:
          - auto
          - entry_id
          - ui_id
          - knowledge_id
          - document_id
          - point_id
          - title
          default: auto
          description: Identifier type. auto tries deterministic exact lookups.
        document_type:
          type: string
          enum:
          - incident
          - rca
          - postmortem
          - runbook
          - knowledge
          description: Optional type hint for stable document ids or title matches.
        response_mode:
          type: string
          enum:
          - compact
          - full
          default: full
          description: compact omits document body; full includes complete content.
      required:
      - id
      title: knowledge_getArguments
    incident_summaryArguments:
      type: object
      properties:
        incident_id:
          type: string
          description: Unique incident identifier (e.g. INC-001). Required unless check_id is provided
            to poll an existing async job.
        include_timeline:
          type: boolean
          default: true
          description: Include event timeline in the response
        include_affected_services:
          type: boolean
          default: true
          description: Include impacted service list in the response
        execution_mode:
          type: string
          enum:
          - auto
          - sync
          - async
          default: auto
          description: Execution strategy. sync runs the read-only correlator inline and returns the summary
            immediately; async dispatches a runner job and returns a job_id to poll via check_id; auto
            picks async when async tools are enabled, else sync.
        wait_for_result:
          type: boolean
          default: true
          description: 'When polling with check_id: if true (default), polls until the job completes;
            if false, returns the current job status immediately.'
        check_id:
          type: string
          description: Existing async job_id to poll. When provided, MCP fetches this job's result instead
            of creating a new summary (incident_id not required).
        workspace_id:
          type: string
          description: Workspace scope for async orchestration. Optional when the token has workspace
            scope or MCP_DEFAULT_WORKSPACE_ID is configured.
      required: []
      title: incident_summaryArguments
    correlate_alertsArguments:
      type: object
      properties:
        alerts:
          type: array
          items:
            type: object
            properties:
              alert_id:
                type: string
                description: Stable alert identifier.
              name:
                type: string
                description: Alert name, for example InstanceDown.
              service:
                type: string
                description: Affected service name.
              severity:
                type: string
                enum:
                - critical
                - high
                - medium
                - warning
                - low
                - info
              status:
                type: string
                enum:
                - firing
                - resolved
                - pending
              fired_at:
                type: string
                format: date-time
                description: Time the alert fired, as an ISO 8601 timestamp.
              labels:
                type: object
                additionalProperties:
                  type: string
                description: Optional alert labels such as env, namespace, pod, or deployment.
              slack:
                type: object
                description: Optional Slack message metadata for the alert.
              thread:
                type: object
                description: Optional Slack thread metadata for the alert.
            required:
            - alert_id
            - name
            - service
            - severity
            - status
            - fired_at
          minItems: 1
          maxItems: 500
          description: Alert objects to correlate. Each alert requires alert_id, name, service, severity,
            status, and fired_at.
        alerts_json:
          type: string
          description: Legacy JSON string containing the same array accepted by alerts. Prefer alerts
            for new calls.
        window_minutes:
          type: integer
          default: 60
          description: Correlation time window in minutes (1-1440)
        min_cluster_size:
          type: integer
          default: 2
          description: Minimum number of alerts required to form a cluster
        execution_mode:
          type: string
          enum:
          - auto
          - sync
          - async
          default: auto
          description: Execution strategy. auto and sync run inline. async is reserved for a future dedicated
            correlation runner.
        workspace_id:
          type: string
          description: Reserved for future async orchestration; ignored for inline correlation.
      title: correlate_alertsArguments
    external_status_checkArguments:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
            enum:
            - aws
            - github
          default:
          - aws
          - github
          description: External status providers to query
        days_back:
          type: integer
          default: 30
          minimum: 1
          maximum: 365
          description: 'How many days of incident history to fetch (default: 30)'
        wait_for_result:
          type: boolean
          default: true
          description: If true (default), polls until the job completes. If false, returns job_id immediately
            for manual polling.
        execution_mode:
          type: string
          enum:
          - auto
          - sync
          - async
          default: async
          description: Runner orchestration mode. auto/sync are coerced to async.
        workspace_id:
          type: string
          description: Workspace scope for async orchestration. Optional when token has workspace scope
            or MCP_DEFAULT_WORKSPACE_ID is configured.
        job_id:
          type: string
          description: UUID of an existing async job to poll. When provided, MCP polls this job and does
            not create a new one.
        check_id:
          type: string
          description: Deprecated alias for job_id. Use job_id for polling an existing async job.
        response_mode:
          type: string
          enum:
          - compact
          - full
          default: compact
          description: compact returns chat-safe summary; full returns raw job result payload.
      required: []
      title: external_status_checkArguments
    slack_alerts_listArguments:
      type: object
      properties:
        channel:
          type: string
          default: alerts
          description: Slack channel name (#alerts or alerts) or channel ID.
        limit:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
          description: Number of recent channel messages to inspect.
        include_raw:
          type: boolean
          default: false
          description: Include extracted raw Slack text in each parsed alert.
        include_threads:
          type: boolean
          default: false
          description: Enable Slack thread metadata or full thread enrichment.
        thread_mode:
          type: string
          enum:
          - none
          - metadata
          - full
          default: none
          description: none returns alert messages only; metadata returns thread counts/users; full fetches
            replies and analysis.
        max_thread_replies:
          type: integer
          default: 20
          minimum: 0
          maximum: 200
          description: Maximum thread replies to fetch when thread_mode=full.
        include_system_messages:
          type: boolean
          default: false
          description: Include Slack channel join/leave and other system messages.
        deduplicate:
          type: boolean
          default: true
          description: Group repeated notifications for the same alert fingerprint and return first_seen,
            last_seen, and occurrences.
        workspace_id:
          type: string
          description: Workspace scope for platform Slack mode. Optional when INCIDENTFLOW_WORKSPACE_ID
            is configured.
      required: []
      title: slack_alerts_listArguments
    slack_alert_thread_getArguments:
      type: object
      properties:
        channel_id:
          type: string
          description: Slack channel ID containing the alert message.
