      description: Tool invocation envelope. `arguments` schema is selected by `name`.
    JsonRpcInitializeRequest:
      type: object
      required:
      - jsonrpc
      - id
      - method
      - params
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - initialize
        params:
          $ref: '#/components/schemas/InitializeParams'
    JsonRpcToolsListRequest:
      type: object
      required:
      - jsonrpc
      - id
      - method
      - params
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - tools/list
        params:
          $ref: '#/components/schemas/ToolsListParams'
    JsonRpcToolsCallRequest:
      type: object
      required:
      - jsonrpc
      - id
      - method
      - params
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - tools/call
        params:
          $ref: '#/components/schemas/ToolsCallParams'
    JsonRpcRequest:
      oneOf:
      - $ref: '#/components/schemas/JsonRpcInitializeRequest'
      - $ref: '#/components/schemas/JsonRpcToolsListRequest'
      - $ref: '#/components/schemas/JsonRpcToolsCallRequest'
    JsonRpcSuccessResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
          - type: 'null'
        result:
          type: object
          additionalProperties: true
    JsonRpcError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    JsonRpcErrorResponse:
      type: object
      required:
      - jsonrpc
      - id
      - error
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
          - type: 'null'
        error:
          $ref: '#/components/schemas/JsonRpcError'
    UnauthorizedError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: 'Missing or malformed Authorization: Bearer <token>.'
    ForbiddenScopeError:
      type: object
      required:
      - error
      - required_scope
      properties:
        error:
          type: string
          enum:
          - insufficient_scope
        required_scope:
          type: string
          example: mcp:tools:run
    ForbiddenDetailError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Insufficient token scope
    RateLimitError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Too Many Requests
    InternalServerError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: internal server error
    ServiceUnavailableError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Token verification service unavailable
    HealthResponse:
      type: object
      required:
      - status
      - service
      - version
      - environment
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          example: incidentflow-mcp
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          example: production
    ReadinessResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
    OAuthProtectedResourceMetadata:
      type: object
      required:
      - resource
      - authorization_servers
      - scopes_supported
      properties:
        resource:
          type: string
          format: uri
          example: https://mcp.incidentflow.io/mcp
        authorization_servers:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        scopes_supported:
          type: array
          items:
            type: string
            enum:
            - mcp:read
            - mcp:tools:run
            - admin
    NotFoundError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          example: Not found
  responses:
    UnauthorizedError:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ForbiddenScopeError'
            - $ref: '#/components/schemas/ForbiddenDetailError'
    RateLimitError:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
    InternalServerError:
      description: Unhandled exception
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    ServiceUnavailableError:
      description: Required token-verification service unavailable; verification fails closed
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token auth. Production clients should use IncidentFlow OAuth or a workspace-scoped
        managed token and request mcp:read plus mcp:tools:run. Send credentials only in the Authorization
        header.
servers:
- url: https://mcp.incidentflow.io
  description: IncidentFlow MCP production origin
externalDocs:
  description: IncidentFlow MCP documentation
  url: https://docs.incidentflow.io
tags:
- name: mcp
  description: Authenticated MCP Streamable HTTP transport and JSON-RPC operations
- name: ops
  description: Public service discovery, health, installer, and metrics endpoints
