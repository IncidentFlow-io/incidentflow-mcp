openapi: 3.1.0
info:
  title: IncidentFlow MCP API
  description: Canonical customer-facing contract for the IncidentFlow MCP Streamable HTTP service. Generated
    from FastAPI routes and canonical MCP tool metadata. Tool schemas carry availability and behavior
    extensions; source presence does not imply public availability.
  version: 0.1.0
  x-incidentflow-release-status: candidate
  x-incidentflow-human-review: pending
paths:
  /install.sh:
    get:
      tags:
      - ops
      summary: Installer script
      description: Return a curl-able installer script with a URL derived from current host.
      operationId: install_sh_install_sh_get
      responses:
        '200':
          description: Installer shell script generated for the current MCP origin
          headers:
            Content-Disposition:
              schema:
                type: string
              example: inline; filename="install.sh"
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            text/x-shellscript:
              schema:
                type: string
              example: '#!/usr/bin/env bash

                # Inspect before execution.

                '
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
  /healthz:
    get:
      tags:
      - ops
      summary: Liveness probe
      description: "Returns 200 OK. Used by Docker/Kubernetes liveness probes \u2014 no auth required."
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
  /readyz:
    get:
      tags:
      - ops
      summary: Readiness probe
      description: "Returns 200 when the app is ready to serve traffic \u2014 no auth required."
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Service is ready to receive requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
  /metrics:
    get:
      tags:
      - ops
      summary: Prometheus metrics
      description: Prometheus text exposition. A production deployment requires bearer authentication
        unless the caller is in a configured trusted monitoring CIDR.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
              example: '# HELP mcp_tool_requests_total MCP tool requests

                '
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
  /.well-known/oauth-protected-resource:
    get:
      tags:
      - ops
      summary: OAuth protected resource metadata
      operationId: oauth_protected_resource__well_known_oauth_protected_resource_get
      responses:
        '200':
          description: OAuth protected-resource metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtectedResourceMetadata'
              example:
                resource: https://mcp.incidentflow.io/mcp
                authorization_servers:
                - https://api.incidentflow.io
                scopes_supported:
                - mcp:read
                - mcp:tools:run
                - admin
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
      description: Discover the authorization server, canonical MCP resource, and supported scopes.
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
      - ops
      summary: OAuth protected resource metadata (MCP path)
      operationId: oauth_protected_resource_mcp__well_known_oauth_protected_resource_mcp_get
      responses:
        '200':
          description: OAuth protected-resource metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProtectedResourceMetadata'
              example:
                resource: https://mcp.incidentflow.io/mcp
                authorization_servers:
                - https://api.incidentflow.io
                scopes_supported:
                - mcp:read
                - mcp:tools:run
                - admin
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
      description: Discover the authorization server, canonical MCP resource, and supported scopes.
  /.well-known/{challenge_path}:
    get:
      tags:
      - ops
      summary: OpenAI domain verification
      description: Return a configured OpenAI Apps domain-verification token only for the exact configured
        challenge path. This is service verification, not a customer API operation.
      operationId: openai_domain_verification__well_known__challenge_path__get
      parameters:
      - name: challenge_path
        in: path
        required: true
        schema:
          type: string
          title: Challenge Path
      responses:
        '200':
          description: Configured domain-verification token
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          description: Challenge path is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security: []
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
  /mcp:
    get:
      tags:
      - mcp
      operationId: mcpGet
      summary: MCP Streamable HTTP handshake
      description: MCP Streamable HTTP endpoint (custom ASGI proxy route). GET is supported by transport
        and may be used by MCP clients for handshake/session semantics.
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
      security:
      - bearerAuth: []
      responses:
        '200':
          description: MCP GET response from FastMCP transport
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
              example: 'event: message\ndata: {...}\n\n'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    options:
      tags:
      - mcp
      operationId: mcpOptions
      summary: MCP CORS preflight
      description: OPTIONS support for MCP endpoint (kept for CORS preflight compatibility).
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
      security:
      - bearerAuth: []
      responses:
        '200':
          description: CORS preflight response
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - mcp
      operationId: mcpPost
      summary: MCP JSON-RPC endpoint
      description: Primary MCP endpoint. Accepts JSON-RPC requests such as `initialize`, `tools/list`,
        and `tools/call`. Use a bearer credential with mcp:read and mcp:tools:run for a tool-using client.
        Some responses may stream over SSE depending on client transport/session flow. Default transport
        and tool limits are deployment policy; honor 429 response headers.
      x-incidentflow-availability: candidate
      x-incidentflow-human-review: pending
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                summary: Initialize session
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2024-11-05'
                    capabilities: {}
                    clientInfo:
                      name: local-dev
                      version: 0.1.0
              toolsList:
                summary: List available tools
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
                  params: {}
              incidentSummaryCall:
                summary: Call incident_summary
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: incident_summary
                    arguments:
                      incident_id: INC-001
                      include_timeline: true
                      include_affected_services: true
                      execution_mode: sync
              correlateAlertsCall:
                summary: Call correlate_alerts
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: tools/call
                  params:
                    name: correlate_alerts
                    arguments:
                      alerts:
                      - alert_id: juniper-qa-001
                        name: CheckoutLatencyHigh
                        service: checkout-api
                        severity: high
                        status: firing
                        fired_at: '2026-08-02T09:00:00Z'
                        labels:
                          environment: qa
                          tenant: junipercart
                      window_minutes: 30
                      min_cluster_size: 1
                      execution_mode: sync
      responses:
        '200':
          description: JSON-RPC success or error payload
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JsonRpcSuccessResponse'
                - $ref: '#/components/schemas/JsonRpcErrorResponse'
              examples:
                success:
                  summary: Generic success response
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    result:
                      tools: []
                rateLimitToolError:
                  summary: Tool-level guard error (still HTTP 200)
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    error:
                      code: -32029
                      message: Rate limit exceeded for tool invocation
            text/event-stream:
              schema:
                type: string
              example: 'event: message\ndata: {...}\n\n'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    IncidentSummaryInput:
      description: Input for the incident_summary tool.
      properties:
        incident_id:
          description: Unique incident identifier
          maxLength: 128
          minLength: 1
          title: Incident Id
          type: string
        include_timeline:
          default: true
          description: Include event timeline in summary
          title: Include Timeline
          type: boolean
        include_affected_services:
          default: true
          description: Include impacted service list
          title: Include Affected Services
          type: boolean
      required:
      - incident_id
      title: IncidentSummaryInput
      type: object
    Severity:
      enum:
      - critical
      - high
      - medium
      - low
      - info
      title: Severity
      type: string
    TimelineEvent:
      properties:
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        description:
          title: Description
          type: string
        actor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Actor
      required:
      - timestamp
      - description
      title: TimelineEvent
      type: object
    IncidentSummaryOutput:
      description: Output from the incident_summary tool.
      properties:
        incident_id:
          title: Incident Id
          type: string
        title:
          title: Title
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          title: Status
          type: string
        summary:
          title: Summary
          type: string
        affected_services:
          items:
            type: string
          title: Affected Services
          type: array
        timeline:
          items:
            $ref: '#/components/schemas/TimelineEvent'
          title: Timeline
          type: array
        recommendations:
          items:
            type: string
          title: Recommendations
          type: array
        human_context_from_slack_thread:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Human Context From Slack Thread
      required:
      - incident_id
      - title
      - severity
      - status
      - summary
      - affected_services
      - timeline
      - recommendations
      title: IncidentSummaryOutput
      type: object
    Alert:
      description: A single alert to be correlated.
      properties:
        alert_id:
          maxLength: 128
          minLength: 1
          title: Alert Id
          type: string
        name:
          title: Name
          type: string
        service:
          title: Service
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        fired_at:
          format: date-time
          title: Fired At
          type: string
        labels:
          additionalProperties:
            type: string
          title: Labels
          type: object
        slack:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Slack
        thread:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Thread
      required:
      - alert_id
      - name
      - service
      - severity
      - status
      - fired_at
      title: Alert
      type: object
    AlertStatus:
      enum:
      - firing
      - resolved
      - pending
      title: AlertStatus
      type: string
    CorrelateAlertsInput:
      description: Input for the correlate_alerts tool.
      properties:
        alerts:
          description: List of alerts to correlate
          items:
            $ref: '#/components/schemas/Alert'
          maxItems: 500
          minItems: 1
          title: Alerts
          type: array
        window_minutes:
          default: 60
          description: Correlation time window in minutes
          maximum: 1440
          minimum: 1
          title: Window Minutes
          type: integer
        min_cluster_size:
          default: 2
          description: Minimum alerts in a cluster to report
          minimum: 1
          title: Min Cluster Size
          type: integer
      required:
      - alerts
      title: CorrelateAlertsInput
      type: object
    AlertCluster:
      description: A group of correlated alerts.
      properties:
        cluster_id:
          title: Cluster Id
          type: string
        alert_ids:
          items:
            type: string
          title: Alert Ids
          type: array
        services:
          items:
            type: string
          title: Services
          type: array
        dominant_severity:
          $ref: '#/components/schemas/Severity'
        likely_root_cause:
          title: Likely Root Cause
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        human_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Human Context
      required:
      - cluster_id
      - alert_ids
      - services
      - dominant_severity
      - likely_root_cause
      - confidence
      title: AlertCluster
      type: object
    CorrelateAlertsOutput:
      description: Output from the correlate_alerts tool.
      properties:
        total_alerts:
          title: Total Alerts
          type: integer
        clusters:
          items:
            $ref: '#/components/schemas/AlertCluster'
          title: Clusters
          type: array
        uncorrelated_alert_ids:
          items:
            type: string
          title: Uncorrelated Alert Ids
          type: array
        analysis_window_minutes:
          title: Analysis Window Minutes
          type: integer
        summary:
          title: Summary
          type: string
      required:
      - total_alerts
      - clusters
      - uncorrelated_alert_ids
      - analysis_window_minutes
      - summary
      title: CorrelateAlertsOutput
      type: object
    incident_summaryArguments:
      type: object
      properties:
        incident_id:
          type: string
          description: Unique incident identifier (e.g. INC-001)
        include_timeline:
          type: boolean
          default: true
          description: Include event timeline in the response
        include_affected_services:
          type: boolean
          default: true
          description: Include impacted service list in the response
        execution_mode:
          type: string
          enum:
          - auto
          - sync
          - async
          default: auto
          description: Execution strategy for explicit demo/test environments. sync reads the built-in
            demo catalog. auto does the same only where async tools are disabled; otherwise auto and explicit
            async fail until a matching incident-summary runner exists. All modes fail in production.
        workspace_id:
          type: string
          description: Reserved for future async orchestration. Ignored for sync summaries.
      required:
      - incident_id
      title: incident_summaryArguments
      x-incidentflow-title: Summarize Incident
      x-incidentflow-availability: not-public
      x-mcp-behavior:
        readOnlyHint: true
        openWorldHint: false
        destructiveHint: false
        idempotentHint: true
    correlate_alertsArguments:
      type: object
      properties:
        alerts:
          type: array
          items:
            type: object
            properties:
              alert_id:
                type: string
                description: Stable alert identifier.
              name:
                type: string
                description: Alert name, for example InstanceDown.
              service:
                type: string
                description: Affected service name.
              severity:
                type: string
                enum:
                - critical
                - high
                - medium
                - low
                - info
              status:
                type: string
                enum:
                - firing
                - resolved
                - pending
              fired_at:
                type: string
                format: date-time
                description: Time the alert fired, as an ISO 8601 timestamp.
              labels:
                type: object
                additionalProperties:
                  type: string
                description: Optional alert labels such as env, namespace, pod, or deployment.
              slack:
                type: object
                description: Optional Slack message metadata for the alert.
              thread:
                type: object
                description: Optional Slack thread metadata for the alert.
            required:
            - alert_id
            - name
            - service
            - severity
            - status
            - fired_at
          minItems: 1
          maxItems: 500
          description: Alert objects to correlate. Each alert requires alert_id, name, service, severity,
            status, and fired_at.
        alerts_json:
          type: string
          description: Legacy JSON string containing the same array accepted by alerts. Prefer alerts
            for new calls.
        window_minutes:
          type: integer
          default: 60
          description: Correlation time window in minutes (1-1440)
        min_cluster_size:
          type: integer
          default: 2
          description: Minimum number of alerts required to form a cluster
        execution_mode:
          type: string
          enum:
          - auto
          - sync
          - async
          default: auto
          description: Execution strategy. auto and sync run inline. async is reserved for a future dedicated
            correlation runner.
        workspace_id:
          type: string
          description: Reserved for future async orchestration; ignored for inline correlation.
      title: correlate_alertsArguments
      x-incidentflow-title: Correlate Alerts
      x-incidentflow-availability: available
      x-mcp-behavior:
        readOnlyHint: true
        openWorldHint: false
        destructiveHint: false
        idempotentHint: true
    external_status_checkArguments:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
            enum:
            - aws
            - github
          default:
          - aws
          - github
          description: External status providers to query
        days_back:
          type: integer
          default: 30
          minimum: 1
          maximum: 365
          description: 'How many days of incident history to fetch (default: 30)'
        wait_for_result:
          type: boolean
          default: true
          description: If true (default), polls until the job completes. If false, returns job_id immediately
            for manual polling.
        execution_mode:
          type: string
          enum:
          - auto
          - sync
          - async
          default: async
          description: Runner orchestration mode. auto/sync are coerced to async.
        workspace_id:
          type: string
          description: Workspace scope for async orchestration. Optional when token has workspace scope
            or MCP_DEFAULT_WORKSPACE_ID is configured.
        check_id:
          type: string
          description: Existing async job_id for polling. When provided, MCP polls this job and does not
            create a new one.
        response_mode:
          type: string
          enum:
          - compact
          - full
          default: compact
          description: compact returns chat-safe summary; full returns raw job result payload.
        persist_to_oms:
          type: boolean
          default: false
          description: Explicitly opt in to storing fetched provider status in IncidentFlow OMS. Omitted
            or false never authorizes storage; deployment policy may still deny a true request.
      required: []
      title: external_status_checkArguments
      x-incidentflow-title: Check External Service Status
      x-incidentflow-availability: conditional
      x-mcp-behavior:
        readOnlyHint: false
        openWorldHint: true
        destructiveHint: false
        idempotentHint: false
    slack_alerts_listArguments:
      type: object
      properties:
        channel:
          type: string
          default: alerts
          description: Slack channel name (#alerts or alerts) or channel ID.
        limit:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
          description: Number of recent channel messages to inspect.
        include_raw:
          type: boolean
          default: false
          description: Include extracted raw Slack text in each parsed alert.
        include_threads:
          type: boolean
          default: false
          description: Enable Slack thread metadata or full thread enrichment.
        thread_mode:
          type: string
          enum:
          - none
          - metadata
          - full
          default: none
          description: none returns alert messages only; metadata returns thread counts/users; full fetches
            replies and analysis.
        max_thread_replies:
          type: integer
          default: 20
          minimum: 0
          maximum: 200
          description: Maximum thread replies to fetch when thread_mode=full.
        include_system_messages:
          type: boolean
          default: false
          description: Include Slack channel join/leave and other system messages.
        workspace_id:
          type: string
          description: Workspace scope for platform Slack mode. Optional when INCIDENTFLOW_WORKSPACE_ID
            is configured.
      required: []
      title: slack_alerts_listArguments
      x-incidentflow-title: Review Slack Alerts
      x-incidentflow-availability: conditional
      x-mcp-behavior:
        readOnlyHint: true
        openWorldHint: true
        destructiveHint: false
        idempotentHint: true
    slack_alert_thread_getArguments:
      type: object
      properties:
        channel_id:
          type: string
          description: Slack channel ID containing the alert message.
        message_ts:
          type: string
          description: Slack root message timestamp or thread_ts.
        include_root:
          type: boolean
          default: true
          description: Include parsed root alert details in the response.
        max_replies:
          type: integer
          default: 50
          minimum: 0
          maximum: 200
          description: Maximum Slack thread replies to fetch.
        workspace_id:
          type: string
          description: Workspace scope for platform Slack mode. Optional when INCIDENTFLOW_WORKSPACE_ID
            is configured.
      required:
      - channel_id
      - message_ts
      title: slack_alert_thread_getArguments
      x-incidentflow-title: Read Slack Alert Thread
      x-incidentflow-availability: conditional
      x-mcp-behavior:
        readOnlyHint: true
        openWorldHint: true
        destructiveHint: false
        idempotentHint: true
    incident_thread_summaryArguments:
      type: object
      properties:
        channel_id:
          type: string
          description: Slack channel ID containing the thread.
        thread_ts:
          type: string
          description: Slack thread timestamp.
        alert_context:
          type: object
          properties:
            alert_name:
              type: string
              description: Alert name from the root Slack alert.
            name:
              type: string
              description: Alternative alert name field.
            summary:
              type: string
              description: Short alert or incident summary.
            service:
              type: string
              description: Affected service name.
            severity:
              type: string
              description: Alert severity.
            status:
              type: string
              description: Alert status.
            labels:
              type: object
              additionalProperties:
                type: string
              description: Alert labels copied from Grafana, Alertmanager, or IncidentFlow.
          description: Optional alert or incident context to shape the summary title/root-cause hints.
        workspace_id:
          type: string
          description: Workspace scope for platform Slack mode. Optional when INCIDENTFLOW_WORKSPACE_ID
            is configured.
      required:
      - channel_id
      - thread_ts
      title: incident_thread_summaryArguments
      x-incidentflow-title: Summarize Incident Thread
